[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hss-core"
version = "0.4.0"
description = "Hidden States as States: OpenAct experiments, reproducible grids and mixture factor analyzers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.2",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "pyyaml>=6.0",
  "threadpoolctl>=3.0",
  "pyarrow>=12.0",
  "zarr>=2.18,<3",
  "tomli>=2; python_version < '3.11'",
  "psutil>=5.9",
]

[project.scripts]
hss = "hss.cli:main"

[project.optional-dependencies]
gpu = ["torch>=2.2"]
readout = ["torch>=2.2", "safetensors>=0.4.5"]
dev = [
  "pytest>=7.0",
  "pytest-xdist",
  "ipython",
]

[tool.setuptools]
package-dir = {"" = "src", "experiments" = "experiments", "hss_workbench" = "hss_workbench", "hss_bundle_bridge" = "hss_bundle_bridge"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["hss*", "experiments*", "hss_workbench*"]

[tool.setuptools.package-data]
hss = ["reporting/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
