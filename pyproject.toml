[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hss-core"
version = "0.3.0"
description = "Hidden States as States: minimal, modular, publication-ready core"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.2",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "pyyaml>=6.0",
  "threadpoolctl>=3.0",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-xdist",
  "ipython",
]

[tool.setuptools]
package-dir = {"" = "src", "experiments" = "experiments", "hss_workbench" = "hss_workbench"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["hss*", "experiments*", "hss_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]